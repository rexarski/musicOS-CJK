name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build package
        run: python3 scripts/build.py --version "$GITHUB_REF_NAME" --release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release suffix (v0.2.1-alpha, v1.0.0-rc.1) becomes a pre-release.
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/musicOS-$GITHUB_REF_NAME.zip" \
            --title "musicOS $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag $prerelease
